# Adventure World — push-to-deploy pipeline.
#
# Every push to main: install → type-check + build → Playwright smoke test
# against the production bundle → publish dist/ to the gh-pages branch.
# A red smoke test blocks the deploy, so the live site only ever receives
# verified builds.
#
# Publishing method: gh-pages BRANCH (not the Pages deployment API). The
# branch method needs only `contents: write` — which the workflow token
# always has — and GitHub auto-publishes the gh-pages branch with zero
# Pages API calls or manual settings. Chosen deliberately after the API
# path (actions/deploy-pages + enablement) failed on this account.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # GitHub Pages project sites serve at /<repo>/ — keep in sync with repo name.
  DEPLOY_BASE: /adventure-world/

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Install smoke-test browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test production bundle
        run: npm run smoke

      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true # keep the branch to a single deploy commit
          commit_message: 'Deploy ${{ github.sha }}'
