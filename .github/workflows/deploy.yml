# Adventure World — push-to-deploy pipeline.
#
# Every push to main: install → type-check + build → Playwright smoke test
# against the production bundle → publish to GitHub Pages. A red smoke test
# blocks the deploy, so the live site only ever receives verified builds.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # GitHub Pages project sites serve at /<repo>/ — keep in sync with repo name.
  DEPLOY_BASE: /adventure-world/

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Install smoke-test browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test production bundle
        run: npm run smoke

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
